<section
  class="ds-empty-state"
  :class="variantClass"
  role="region"
  :aria-labelledby="titleId"
  :aria-describedby="description ? descId : undefined"
  v-bind="$attrs"
>
  <div v-if="icon || $slots.icon" class="ds-empty-state__icon-wrapper">
    <slot name="icon">
      <DsIcon :icon="icon" size="xl" aria-hidden="true" class="ds-empty-state__icon" />
    </slot>
  </div>

  <div class="ds-empty-state__content">
    <component
      :is="headingTag"
      :id="titleId"
      class="ds-empty-state__title"
    >
      <slot name="title">{{ title }}</slot>
    </component>

    <p
      v-if="description || $slots.description"
      :id="descId"
      class="ds-empty-state__description"
    >
      <slot name="description">{{ description }}</slot>
    </p>
  </div>

  <div
    v-if="actionLabel || $slots.actions"
    class="ds-empty-state__actions"
  >
    <slot name="actions">
      <DsButton
        variant="secondary"
        size="md"
        @click="handleAction"
      >
        {{ actionLabel }}
      </DsButton>
    </slot>
  </div>
</section>
