<component
  :is="tag"
  :type="isLink ? undefined : type"
  :href="isLink && !disabled && !loading ? href : undefined"
  :target="isLink ? target : undefined"
  :rel="isLink ? effectiveRel : undefined"
  :role="isLink ? 'button' : undefined"
  :tabindex="isLink && (disabled || loading) ? -1 : undefined"
  class="ds-button"
  :class="[
    `ds-button--${variant}`,
    `ds-button--${size}`,
    {
      'ds-button--loading': loading,
      'ds-button--icon-only': isIconOnly,
      'ds-button--full-width': fullWidth,
      'ds-button--disabled': isLink && (disabled || loading)
    }
  ]"
  :disabled="isLink ? undefined : (disabled || loading)"
  :aria-disabled="isLink && (disabled || loading) ? 'true' : undefined"
  :aria-busy="loading ? 'true' : undefined"
  :aria-label="ariaLabel"
  @click="handleClick"
  @keydown.space="handleSpaceKey"
>
  <span v-if="loading" class="ds-button__spinner">
    <DsSpinner size="sm" variant="current" />
  </span>
  <span v-if="$slots.prefix" class="ds-button__prefix" aria-hidden="true">
    <slot name="prefix" />
  </span>
  <span v-if="$slots.default" class="ds-button__content">
    <slot />
  </span>
  <span v-if="$slots.suffix" class="ds-button__suffix" aria-hidden="true">
    <slot name="suffix" />
  </span>
</component>
