<article
  class="ds-card"
  :class="[
    variantClass,
    paddingClass,
    accentClass,
    {
      'ds-card--clickable': isClickable,
      'ds-card--interactive': interactive,
      'ds-card--undivided': !divided
    }
  ]"
  v-bind="$attrs"
>
  <div v-if="$slots.media" class="ds-card__media">
    <slot name="media" />
  </div>

  <header v-if="$slots.header || title" class="ds-card__header">
    <slot name="header">
      <h3 class="ds-card__title">{{ title }}</h3>
    </slot>
  </header>

  <div class="ds-card__body">
    <a
      v-if="href"
      :href="href"
      :target="target"
      :rel="computedRel"
      class="ds-card__link"
      tabindex="0"
    >
      <slot />
      <DsVisuallyHidden v-if="target === '_blank'"> (opens in a new tab)</DsVisuallyHidden>
    </a>
    <slot v-else />
  </div>

  <footer v-if="$slots.footer" class="ds-card__footer">
    <slot name="footer" />
  </footer>
</article>
