<article
  class="ds-card"
  :class="[
    variantClass,
    paddingClass,
    accentClass,
    {
      'ds-card--clickable': isClickable,
      'ds-card--interactive': interactive,
      'ds-card--undivided': !divided
    }
  ]"
  v-bind="$attrs"
>
  <div v-if="$slots.media" class="ds-card__media">
    <slot name="media" />
  </div>

  <header v-if="$slots.header || title" class="ds-card__header">
    <slot name="header">
      <h3 class="ds-card__title">
        <a v-if="linksTitle" :href="href" :target="target" :rel="computedRel" class="ds-card__link">
          {{ title }}<DsVisuallyHidden v-if="target === '_blank'"> {{ newTabLabel }}</DsVisuallyHidden>
        </a>
        <template v-else>{{ title }}</template>
      </h3>
    </slot>
  </header>

  <div :id="bodyId" class="ds-card__body">
    <slot />
  </div>

  <footer v-if="$slots.footer" class="ds-card__footer">
    <slot name="footer" />
  </footer>

  <a
    v-if="href && !linksTitle"
    :href="href"
    :target="target"
    :rel="computedRel"
    :aria-labelledby="overlayLabelledby"
    class="ds-card__link ds-card__link--overlay"
  >
    <DsVisuallyHidden v-if="linkLabel">{{ linkLabel }}</DsVisuallyHidden>
    <DsVisuallyHidden v-if="target === '_blank'" :id="newTabId"> {{ newTabLabel }}</DsVisuallyHidden>
  </a>
</article>
