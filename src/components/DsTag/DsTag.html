<span :class="tagClasses">
  <slot name="prefix">
    <DsIcon
      v-if="icon"
      :name="typeof icon === 'string' ? icon : undefined"
      :icon="typeof icon === 'object' || typeof icon === 'function' ? icon : undefined"
      size="sm"
      class="ds-tag__icon"
    />
    <span v-else-if="prefix" class="ds-tag__prefix" aria-hidden="true">{{ prefix }}</span>
  </slot>
  <span class="ds-tag__label">
    <slot />
  </span>
</span>
