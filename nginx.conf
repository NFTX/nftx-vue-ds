server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Security headers. A location with its own add_header drops these,
    # so locations below only use `expires`, which does not.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml;

    # Storybook manager index and SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Story preview frame: always revalidate
    location = /iframe.html {
        expires -1;
        try_files $uri =404;
    }

    # Vite output in /assets/ has content-hashed names; other files revalidate via ETag
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
}
